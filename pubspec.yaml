name: realtime_chat
description: "A new Flutter project."


publish_to: 'none' 



version: 1.0.0+1

environment:
  sdk: ^3.12.0



dependencies:
  flutter:
    sdk: flutter

  # Dependencies
  bloc: ^9.2.1
  path: ^1.9.1

  get_it: ^9.2.1
  shimmer: ^3.0.0
  iconsax: ^0.0.8
  hugeicons: ^1.1.7
  camera: ^0.12.0+2
  equatable: ^2.1.0
  go_router: ^17.5.0
  photo_view: ^0.15.0
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  google_sign_in: ^7.2.0
  cupertino_icons: ^1.0.9
  phosphoricons_flutter: ^1.0.0
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.1
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.8
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.0

  # Firebase Packages
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0


  # Local Storage
  drift_flutter: ^0.3.1
  drift: ^2.34.3
  sqlite3: ^3.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.0
  drift_dev: ^2.34.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:

  uses-material-design: true


  assets:
    - assets/icons/
    - assets/logo/



  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  


  
